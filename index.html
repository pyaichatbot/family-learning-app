<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Learning App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm "paper" surface in soft, low-saturation colours, big touch targets, landscape-friendly grids so the phone mirrors well to a TV. Single light theme by choice. */
:root{
  color-scheme:light;
  --paper:#EAF2EE; --card:#FBFCFA; --ink:#1B3A40; --muted:#56717A; --line:#CBDDD6;
  --sun:#E9B04C; --sky:#2C6F86; --berry:#BF5570; --leaf:#3F9370;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
#app{min-height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sky);color:#fff;position:sticky;top:0;z-index:5}
.bar h1{font-size:1.35rem;flex:1;min-width:0;overflow-wrap:anywhere}
.back{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.8rem;line-height:1;flex:none}
.back.ghost{background:none;width:0;padding:0}
.bar-r{display:flex;align-items:center;gap:10px;flex:none}
.seg{display:flex;background:rgba(255,255,255,.18);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:9px;font-weight:700}
.seg button.on{background:#fff;color:var(--sky)}
.stars{font-family:var(--display);font-size:1.15rem;background:var(--sun);color:var(--ink);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
.note{color:var(--muted);font-size:.95rem;margin:0}
.warn{background:#FFF4D6;border:1px solid var(--sun);border-radius:12px;padding:10px 12px;font-size:.95rem}

/* profiles */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.person{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.person .face{font-size:3.4rem;line-height:1}
.person .nm{font-family:var(--display);font-size:1.5rem}
.person .sub{color:var(--muted);font-size:.9rem}
.person:hover{border-color:var(--sky)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--sky);background:var(--sky);color:#fff;border-radius:14px;padding:10px 18px;font-weight:700;min-height:46px}
.btn.alt{background:var(--card);color:var(--sky)}
.btn.warm{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:220px;resize:vertical;line-height:1.5}

/* menus */
.grp h2{font-size:1.25rem;margin-bottom:8px;color:var(--sky)}
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile-card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:128px;justify-content:center}
.tile-card .ic{font-size:2.6rem;line-height:1.1}
.tile-card .lb{font-family:var(--display);font-size:1.1rem;text-align:center;line-height:1.1}
.tile-card .mini{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile-card:hover{border-color:var(--sun)}
.adult .tile-card{align-items:flex-start;text-align:left;padding:16px;min-height:110px}
.adult .tile-card .lb{text-align:left;font-size:1.25rem}
.adult .tile-card .mini{font-size:.92rem}
.adult .tiles-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

/* kid games */
.game{display:flex;flex-direction:column;align-items:center;gap:18px}
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--sun)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pic{font-size:clamp(5rem,22vh,9rem);line-height:1.1}
.word{font-family:var(--display);font-size:clamp(2.6rem,10vw,5rem);letter-spacing:.04em}
.sent{font-family:var(--display);font-size:clamp(1.7rem,6vw,3rem);max-width:18ch}
.ask{font-family:var(--display);font-size:1.5rem}
.hear{width:60px;height:60px;border-radius:50%;border:0;background:var(--sun);font-size:1.7rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;width:100%;max-width:820px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:22px;min-height:104px;font-family:var(--display);font-size:2.3rem;padding:8px;display:flex;align-items:center;justify-content:center}
.opt.big{font-size:3.6rem}
.opt.ok{border-color:var(--leaf);background:#DDF3E6}
.opt.no{border-color:var(--berry);background:#FBE3EA;opacity:.6}
.emo-row{font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:.12em;max-width:16em;overflow-wrap:anywhere;line-height:1.35}
.emo-row .gone{opacity:.22}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.slot{width:64px;height:76px;border-bottom:5px solid var(--sky);font-family:var(--display);font-size:3rem;display:flex;align-items:center;justify-content:center}
.slot.full{color:var(--leaf)}
.tile{width:72px;height:76px;border-radius:18px;border:3px solid var(--sun);background:var(--card);font-family:var(--display);font-size:2.6rem}
.tile.used{visibility:hidden}
.tile.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;width:100%}
.letters button{background:var(--card);border:3px solid var(--line);border-radius:18px;font-family:var(--display);font-size:1.9rem;min-height:72px}
.letters button.on{border-color:var(--sun);background:#FFF4D6}
.lcard{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:22px;border:2px solid var(--line);padding:12px 22px;min-height:120px}
.lcard .big{font-family:var(--display);font-size:4rem;line-height:1}
.lcard .pic{font-size:4rem}
.lcard .wd{font-family:var(--display);font-size:2rem}
.pad{position:relative;width:min(100%,62vh,560px);aspect-ratio:1;background:var(--card);border:3px solid var(--line);border-radius:24px;overflow:hidden;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.mem{display:grid;grid-template-columns:repeat(4,minmax(64px,110px));gap:10px;justify-content:center;width:100%}
.mem button{aspect-ratio:1;border-radius:18px;border:3px solid var(--line);background:var(--sky);font-size:2.6rem;color:transparent}
.mem button.up{background:var(--card);color:inherit}
.mem button.ok{background:#DDF3E6;border-color:var(--leaf);color:inherit}
.finish{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.finish .big{font-size:4.5rem;line-height:1}
.finish h2{font-size:2.2rem}
.tod{display:flex;flex-direction:column;align-items:center;gap:14px}
.tod .pic{font-size:clamp(7rem,34vh,13rem)}
.tod .w{font-family:var(--display);font-size:2.2rem;text-align:center}
.tod .w small{display:block;font-size:1.4rem;color:var(--muted);font-family:var(--body);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:760px}
.two .opt{min-height:220px;font-size:clamp(5rem,20vw,9rem)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff}

/* adults */
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:1.25rem}
.panel h3{font-size:1.05rem;color:var(--sky)}
.de{font-weight:700}
.task{font-size:1.05rem;max-width:65ch}
.task ul{margin:6px 0 0;padding-left:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.good{background:#DDF3E6;border-color:var(--leaf)}
.pill.low{background:#FBE3EA;border-color:var(--berry)}
.pill.mid{background:#FFF4D6;border-color:var(--sun)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{font-weight:700;color:var(--sky);cursor:pointer;padding:6px 0}
.phr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.phr li{display:flex;gap:10px;align-items:flex-start}
.phr .sp{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);font-size:1rem}
.phr small{display:block;color:var(--muted)}
.fix{border-left:4px solid var(--berry);padding-left:10px}
.fix s{color:var(--berry)}
.fix b{color:var(--leaf)}
.fix small{display:block;color:var(--muted)}
.pre{white-space:pre-wrap;max-width:65ch}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:240px;justify-content:center}
.card .fw{font-family:var(--display);font-size:2.2rem}
.card .ex{color:var(--muted);max-width:40ch}
.card .en{font-size:1.3rem;font-weight:700}
.gopts{display:flex;flex-direction:column;gap:10px}
.gopts button{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600;min-height:48px}
.gopts button.ok{border-color:var(--leaf);background:#DDF3E6}
.gopts button.no{border-color:var(--berry);background:#FBE3EA}
.q{font-size:1.3rem;font-weight:700}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.vlist div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.vlist small{display:block;color:var(--muted)}
.slides{margin:0;padding-left:22px}
/* motion: slow, purposeful, never looping fast or flashing */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes yes{40%{transform:scale(1.08)}}
@keyframes settle{from{opacity:0;transform:scale(.7) rotate(-6deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(233,176,76,.6)}100%{box-shadow:0 0 0 22px rgba(233,176,76,0)}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes up{to{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes slidein{from{opacity:0;transform:translateX(120px)}}
.main>*{animation:rise .32s ease-out both}
.tile-card,.person{animation:pop .36s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i,0)*40ms);transition:transform .15s,border-color .15s}
.tile-card:active,.person:active,.opt:active,.btn:active{transform:scale(.97)}
.opt{transition:transform .15s,background .25s,border-color .25s;animation:pop .3s both;animation-delay:calc(var(--i,0)*70ms)}
.opt.ok{animation:yes .5s}
.opt.no{animation:shake .35s}
.pic{animation:settle .5s cubic-bezier(.2,.8,.3,1.3) both}
.emo-row .it{display:inline-block;animation:pop .3s both;animation-delay:calc(var(--i)*110ms)}
.slots{transition:gap .5s}
.slots.done{gap:0}
.slots.done .slot{border-color:var(--leaf);animation:yes .6s}
.tile{animation:pop .3s both;animation-delay:calc(var(--i,0)*60ms)}
.hear.say{animation:ring 1.2s}
.gap{color:var(--berry)}
.gap.in{color:var(--leaf);display:inline-block;animation:yes .5s}
.fly{position:fixed;z-index:20;font-size:2rem;color:var(--sun);pointer-events:none;transition:transform .7s cubic-bezier(.3,.1,.3,1),opacity .7s}
.stars.bump{animation:yes .4s}
.garden{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;background:linear-gradient(#E2EEE9,#D3E6DB);border-radius:20px;padding:12px 16px;min-height:74px;font-size:2rem;width:100%}
.garden span{display:inline-block;transform-origin:bottom center;animation:sway 5s ease-in-out infinite;animation-delay:calc(var(--i,0)*-0.7s)}
.garden .gnote{font-size:1rem;color:var(--muted);animation:none;align-self:center}
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.float i{position:absolute;bottom:-40px;width:22px;height:22px;border-radius:50%;opacity:.5;animation:up 3.4s ease-out forwards}
.tod .pic{animation:settle .5s both,breathe 3.5s ease-in-out .5s infinite}
.mem button{transition:background .25s,border-color .25s}
.mem button.up{animation:pop .3s}
.stage{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;min-height:170px;font-size:clamp(2rem,7vw,3.2rem);width:100%}
.stage.small{min-height:0;font-size:clamp(1.5rem,5vw,2.2rem)}
.obj{display:inline-block;animation:pop .35s both;transition:transform .5s,opacity .5s}
.obj.lit{transform:scale(1.3)}
.obj.away{opacity:.12;transform:translateY(-34px) scale(.7)}
.box{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;border:3px dashed var(--line);border-radius:20px;min-width:90px;min-height:70px;justify-content:center;align-items:center;animation:pop .4s both;animation-delay:calc(var(--i,0)*120ms);transition:border-color .3s,background .3s}
.box.lit{border-color:var(--sun);background:#FFF4D6}
.box.slide{animation:slidein .8s both}
.box.plate{border-style:solid;border-radius:999px;min-width:120px}
.cap{font-family:var(--display);font-size:1.6rem;text-align:center;min-height:2.6em;max-width:22ch}
.eq{font-size:clamp(2.2rem,8vw,3.6rem);min-height:1.2em}
.chat{display:flex;flex-direction:column;gap:8px}
.chat .me,.chat .them{max-width:85%;padding:8px 12px;border-radius:14px}
.chat .me{align-self:flex-end;background:var(--sky);color:#fff}
.chat .them{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.opt{min-height:88px;font-size:2rem}.slot{width:50px;height:64px;font-size:2.4rem}.tile{width:58px;height:64px;font-size:2.1rem}.bar h1{font-size:1.15rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------- tiny helpers ---------- */
const app=document.getElementById('app');
function el(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const n in a){const v=a[n];if(v==null||v===false)continue;
    if(n==='class')e.className=v;else if(n.slice(0,2)==='on')e.addEventListener(n.slice(2),v);
    else if(n==='style')e.style.cssText=v;else e.setAttribute(n,v===true?'':v);}
  const add=c=>{if(c==null||c===false)return;if(Array.isArray(c))c.forEach(add);else e.append(c.nodeType?c:String(c));};
  kids.forEach(add);return e;
}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=(a,n)=>shuffle(a).slice(0,n);
function near(n,min,max){const s=new Set([n]);let guard=0;while(s.size<4&&guard++<200){const v=n+rnd(7)-3;if(v>=min&&v<=max)s.add(v);}let x=min;while(s.size<4)s.add(x++);return shuffle([...s]);}
const DAY=864e5;

/* ---------- state and saving ---------- */
const PIDS=['p1','p2','p3','p4'];
const DEF={p1:{name:'Big kid',kind:'kid',icon:'🦊'},p2:{name:'Little kid',kind:'toddler',icon:'🐣'},p3:{name:'Mama',kind:'adult',icon:'🌷'},p4:{name:'Papa',kind:'adult',icon:'🧭'}};
function fresh(p){return {name:DEF[p].name,t:0,lang:'en',stars:{},srs:{},mistakes:[],writing:[],extra:[],gram:{done:0,right:0,wrong:[]},traceIdx:0,wx:{1:[],2:[],3:[]}};}
const st={};PIDS.forEach(p=>st[p]=fresh(p));
function adopt(p,v){const f=fresh(p);st[p]=Object.assign(f,v);st[p].gram=Object.assign({done:0,right:0,wrong:[]},v.gram||{});st[p].wx=Object.assign({1:[],2:[],3:[]},v.wx||{});}
try{const j=JSON.parse(localStorage.getItem('fla-v1')||'null');if(j)PIDS.forEach(p=>{if(j[p])adopt(p,j[p]);});}catch(e){}
let db=null,busy=false,saveTimer=null,syncMsg='';const dirty=new Set();
function save(p){st[p].t=Date.now();try{localStorage.setItem('fla-v1',JSON.stringify(st));}catch(e){}
  dirty.add(p);clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500);}
async function flush(){if(!db||busy)return;busy=true;
  try{for(const p of [...dirty]){dirty.delete(p);await db.doc('profiles/'+p).set(JSON.parse(JSON.stringify(st[p])));}}
  catch(e){dirty.clear();syncMsg='Progress is saved on this device only right now.';}
  busy=false;if(dirty.size){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500);}}
function use(n){try{const c=window.claude;return c&&c.use?c.use(n).catch(()=>null):Promise.resolve(null);}catch(e){return Promise.resolve(null);}}
let ai=null,ctts=null,dict=null,dictTarget=null,dictBtn=null;
use('sample').then(s=>{ai=s;});
use('tts').then(t=>{ctts=t;});
use('dictation').then(d=>{dict=d;if(!d)return;try{
  d.onFinal(o=>{if(dictTarget)dictTarget.value+=(dictTarget.value?' ':'')+o.text;});
  d.onState(o=>{if(dictBtn)dictBtn.textContent=o.state==='listening'?'Stop dictating':'Dictate';});}catch(e){}});
use('db').then(async d=>{if(!d)return;db=d;try{
  for(const p of PIDS){const s=await d.doc('profiles/'+p).get();
    if(s.exists){const v=s.data();if(v&&(v.t||0)>(st[p].t||0))adopt(p,JSON.parse(JSON.stringify(v)));else if((st[p].t||0)>(v&&v.t||0))dirty.add(p);}
    else if(st[p].t)dirty.add(p);}
  flush();if(!cur)home();}catch(e){syncMsg='Progress is saved on this device only right now.';}});

/* ---------- speech and sound ---------- */
let voiceMode='auto',deVoice='';try{voiceMode=localStorage.getItem('fla-voice')||'auto';deVoice=localStorage.getItem('fla-devoice')||'';}catch(e){}
const vtag=x=>String(x.lang||'').replace('_','-').toLowerCase();
function deviceVoices(pre){try{return (window.speechSynthesis.getVoices()||[]).filter(x=>vtag(x)===pre||vtag(x).indexOf(pre+'-')===0);}catch(e){return [];}}
function webSay(parts){try{const ss=window.speechSynthesis;if(!ss)return;
  /* speak() straight after cancel() is dropped by Safari and Chrome, so wait a moment, but only when something was playing (first call must stay inside the tap). */
  if(ss.speaking||ss.pending){ss.cancel();clearTimeout(sayTimer);sayTimer=setTimeout(()=>webSpeak(ss,parts),120);}else webSpeak(ss,parts);}catch(e){}}
let sayTimer=null;
function webSpeak(ss,parts){try{
  parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p.text),de=p.lang==='de';u.lang=de?'de-DE':'en-GB';u.rate=p.rate||0.85;
    const vs=deviceVoices(de?'de':'en'),v=(de&&vs.find(x=>x.name===deVoice))||vs.find(x=>vtag(x)===(de?'de-de':'en-gb'))||vs[0];if(v){u.voice=v;u.lang=v.lang.replace('_','-');}ss.speak(u);});}catch(e){}}
function sayParts(parts){
  parts=parts.map(p=>p.lang==='de'?Object.assign({},p,{text:String(p.text).replace(/\d+/g,m=>deNum(+m))}):p);
  if(ctts&&voiceMode!=='device'){try{const one=parts.every(p=>p.lang===parts[0].lang),tag=l=>l==='de'?'de-DE':'en-US';

const noAI='AI help is not available in this view. Open the app in Claude on a signed-in device to use it.';
async function askJSON(prompt){
  let v;if(typeof ai.json==='function')v=await ai.json(prompt);else v=(await ai(prompt)).text;
  if(v&&typeof v==='object'&&typeof v.text==='string'&&Object.keys(v).length<=2)v=v.text;
  if(typeof v==='string'){const m=v.match(/[\[{][\s\S]*[\]}]/);v=JSON.parse(m?m[0]:v);}return v;}
const errMsg=e=>e&&e.code==='rate_limited'?'Too many requests right now. Wait a minute and try again.':e&&e.code==='not_granted'?'AI help is switched off for this page.':'That did not work. Check the connection and try again.';
const pillClass=n=>n>=70?'pill good':n>=60?'pill mid':'pill low';

function timerPill(mins){
  let left=mins*60,running=false;const out=el('span',{class:'pill'},'');const fmt=()=>{out.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');out.className=left===0?'pill low':'pill';};fmt();
  const btn=el('button',{class:'btn alt',type:'button',onclick:()=>{running=!running;btn.textContent=running?'Pause timer':'Start timer';if(ticker){clearInterval(ticker);ticker=null;}
    if(running)ticker=setInterval(()=>{if(left>0)left--;fmt();if(left===0){clearInterval(ticker);ticker=null;chime(false);}},1000);}},'Start timer');
  return [out,btn];
}

  const est=Math.max(0,Math.min(100,Math.round(Number(r.estimate))||0));
  const ms=Array.isArray(r.mistakes)?r.mistakes.slice(0,8).filter(m=>m&&m.wrong&&m.right):[];
  const s=st[cur];s.writing.push({t:Date.now(),teil:n,words:wordCount(text),est});if(s.writing.length>40)s.writing=s.writing.slice(-40);
  ms.forEach(m=>{if(!s.mistakes.some(x=>x.wrong===m.wrong))s.mistakes.push({wrong:String(m.wrong).slice(0,200),right:String(m.right).slice(0,200),rule:String(m.rule||'').slice(0,240)});});
  if(s.mistakes.length>120)s.mistakes=s.mistakes.slice(-120);save(cur);

    el('div',{class:'meta'},el('span',{class:pillClass(est)},'Estimate '+est+'/100'),el('span',{class:'note'},'Pass mark is 60. A rough guide, not an official score.')),
